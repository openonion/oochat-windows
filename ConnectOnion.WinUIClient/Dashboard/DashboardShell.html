<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      color-scheme: light dark;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: Canvas;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: Canvas;
    }
  </style>
</head>
<body>
  <iframe
    id="dashboard"
    title="Agent dashboard"
    sandbox="allow-scripts"
    referrerpolicy="no-referrer"></iframe>
  <script nonce="__NONCE__">
    const frame = document.getElementById("dashboard");

    window.addEventListener("message", event => {
      const { source, origin, data } = event;
      if (source !== frame.contentWindow || origin !== "null") return;
      if (data?.type !== "run_skill" || data.token !== "__TOKEN__") return;

      window.chrome.webview.postMessage(data);
    });

    const htmlBytes = Uint8Array.from(
      atob("__HTML__"),
      character => character.charCodeAt(0)
    );
    frame.srcdoc = new TextDecoder().decode(htmlBytes);
  </script>
</body>
</html>
