name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (WinUI 3 / .NET)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # global.json in the repo pins the SDK feature band; keep this in step with it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The solution lives under ConnectOnion.WinUIClient/ and references every
      # project by relative path; there is no solution file at the repo root, so
      # bare `dotnet restore` has nothing to act on.
      - name: Restore
        run: dotnet restore ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln

      - name: Build (Release)
        run: >
          dotnet build ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
          --configuration Release --no-restore

      # UI tests drive a real window and cannot run on a headless runner.
      - name: Test
        run: >
          dotnet test ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
          --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName!~UITests"
