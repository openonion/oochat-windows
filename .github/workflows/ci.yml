name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (WinUI 3 / .NET)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # global.json in the repo pins the SDK feature band; keep this in step with it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The solution lives under ConnectOnion.WinUIClient/ and references every
      # project by relative path; there is no solution file at the repo root, so
      # bare `dotnet restore` has nothing to act on.
      # Platform must be explicit. The solution offers Any CPU, which resolves to
      # PlatformTarget x86 and then conflicts with the win-x64 RuntimeIdentifier
      # (NETSDK1032). The project's own build scripts pass -p:Platform=x64 too.
      - name: Restore
        run: >
          dotnet restore ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
          -p:Platform=x64

      # PublishReadyToRun is on for every non-Debug configuration, but R2R needs
      # the runtime pack that only a publish restore pulls in (NETSDK1094). It is
      # a publish-time optimisation, so turn it off for the build/test pass —
      # the publish step below, and release.yml, still ship trimmed.
      - name: Build (Release)
        run: >
          dotnet build ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
          --configuration Release --no-restore -p:Platform=x64
          -p:PublishReadyToRun=false -p:PublishTrimmed=false

      # The app publish must match what production ships — trimmed and
      # self-contained. Architecture/TrimmingGateTests asserts this workflow
      # actually does it, so the gate is evidence rather than intention.
      #
      # Publish intermediates from the Release build above are untrimmed; reusing
      # them with --no-restore can silently produce an untrimmed artifact even
      # with PublishTrimmed=true. Clean them and let publish restore its own graph.
      - name: Clean publish intermediates
        shell: pwsh
        run: >
          dotnet clean ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          -p:BuildProjectReferences=false

      # The RID-specific publish uses a different global-property graph from the
      # solution build, and each participating project commits a separate lock
      # file for it (packages.publish.lock.json). Without NuGetLockFilePath the
      # restore validates against the ordinary lock file and fails NU1004 on the
      # RID and ILLink references this publish propagates to Core and Protocol.
      - name: Publish (trimmed, self-contained)
        shell: pwsh
        run: >
          dotnet publish ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          -p:RunUnpackaged=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishTrimmed=true
          -p:PublishReadyToRun=true
          -p:RuntimeIdentifiers=win-x64
          -p:NuGetLockFilePath=packages.publish.lock.json
          -p:AppxPackageSigningEnabled=false
          -p:RestoreLockedMode=false
          -p:RestoreForceEvaluate=true

      # UI tests drive a real window and cannot run on a headless runner.
      - name: Test
        run: >
          dotnet test ConnectOnion.WinUIClient/ConnectOnion.WinUIClient.sln
          --configuration Release --no-build --verbosity normal
          -p:Platform=x64 -p:PublishReadyToRun=false -p:PublishTrimmed=false
          --filter "FullyQualifiedName!~UITests"
